[functions.process-notification-queue]
verify_jwt = false

[functions.run-pending-order-reminders]
verify_jwt = false

[functions.cleanup-deleted-accounts]
verify_jwt = false

# Customer and merchant calls. Supabase must require a valid user JWT.
[functions.sslcommerz-initiate]
verify_jwt = true

[functions.sslcommerz-validate-config]
verify_jwt = true

# SSLCommerz calls these URLs directly, so JWT verification must be disabled.
# Each callback is independently verified against the gateway validation/query API.
[functions.sslcommerz-success]
verify_jwt = false

[functions.sslcommerz-fail]
verify_jwt = false

[functions.sslcommerz-cancel]
verify_jwt = false

[functions.sslcommerz-ipn]
verify_jwt = false
